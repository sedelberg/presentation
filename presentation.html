<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data&Analytics Presentation</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="iff_style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
</head>
<body>

    <!-- Sleek Progress Bar -->
    <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
    </div>

    <div id="presentation-container">
    </div>
    
    <!-- Slide Sorter Overlay -->
    <div id="slide-sorter" class="slide-sorter-overlay">
        <div class="sorter-header">
            <h2>Slide Sorter</h2>
            <button class="btn" onclick="toggleSlideSorter()">Close (G)</button>
        </div>
        <div id="sorter-grid" class="sorter-grid"></div>
    </div>

    <!-- Theme Settings Panel -->
    <div id="theme-settings" class="theme-settings-panel">
        <h3>Brand Colors</h3>
        <div class="color-picker-group">
            <label>Primary (Green): <input type="color" id="color-primary" value="#01C38E" onchange="updateBrandColor('--green', this.value)"></label>
            <label>Secondary (Blue): <input type="color" id="color-secondary" value="#0090D6" onchange="updateBrandColor('--blue', this.value)"></label>
            <label>Navy: <input type="color" id="color-navy" value="#132D46" onchange="updateBrandColor('--navy', this.value)"></label>
        </div>
        <button class="btn" style="margin-top: 20px;" onclick="toggleThemeSettings()">Close</button>
    </div>
    
    <div class="page-indicator" id="page-counter"></div>
    
    <div class="controls">
        <button class="btn" onclick="toggleThemeSettings()" title="Theme Settings">🎨</button>
        <button class="btn" onclick="toggleSlideSorter()" title="Slide Sorter (G)">🔳</button>
        <button class="btn" onclick="exportPDF()" title="Export to PDF">📄</button>
        <button class="btn" onclick="downloadData()" title="Download Presentation Data">💾</button>
        <button class="btn" onclick="openPresenterView()" title="Open Presenter View">📽️</button>
        <button class="btn" onclick="toggleFullscreen()" title="Fullscreen (F)">⛶</button>
        <button class="btn" onclick="prevSlide()">&#9664; Prev</button>
        <button class="btn" onclick="nextSlide()">Next &#9654;</button>
    </div>

    <script src="data.js"></script>
    <script src="renderer.js"></script>

    <script>
        const container = document.getElementById('presentation-container');
        let currentSlideIdx = 0;
        let chartInstances = [];
        const syncChannel = new BroadcastChannel('presentation_sync');

        syncChannel.onmessage = (event) => {
            if (event.data.type === 'jump') {
                currentSlideIdx = event.data.index;
                updateCounter(false);
            }
        };

        function openPresenterView() {
            window.open('presenter.html', 'PresenterView', 'width=1000,height=700');
        }

        function downloadData() {
            const dataStr = "const presentationData = " + JSON.stringify(presentationData, null, 4) + ";";
            const dataUri = 'data:application/javascript;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = 'data.js';
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        function toggleSlideSorter() {
            const sorter = document.getElementById('slide-sorter');
            const grid = document.getElementById('sorter-grid');
            
            if (sorter.classList.contains('active')) {
                sorter.classList.remove('active');
            } else {
                grid.innerHTML = '';
                const slides = document.querySelectorAll('.slide');
                slides.forEach((slide, index) => {
                    const thumb = document.createElement('div');
                    thumb.className = `sorter-thumb ${index === currentSlideIdx ? 'active' : ''}`;
                    
                    // Clone slide content for thumbnail
                    const content = slide.cloneNode(true);
                    content.classList.remove('active', 'prev');
                    content.classList.add('thumb-content');
                    
                    thumb.appendChild(content);
                    thumb.onclick = () => {
                        currentSlideIdx = index;
                        updateCounter();
                        sorter.classList.remove('active');
                    };
                    
                    grid.appendChild(thumb);
                });
                sorter.classList.add('active');
            }
        }

        function exportPDF() {
            const element = document.getElementById('presentation-container');
            const opt = {
                margin: 0,
                filename: 'presentation.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
            };
            
            // Temporary show all slides for export
            const slides = document.querySelectorAll('.slide');
            slides.forEach(s => s.style.position = 'relative');
            slides.forEach(s => s.style.visibility = 'visible');
            slides.forEach(s => s.style.opacity = '1');
            slides.forEach(s => s.style.transform = 'none');
            slides.forEach(s => s.style.filter = 'none');

            html2pdf().set(opt).from(element).save().then(() => {
                // Restore state
                slides.forEach(s => s.style.position = '');
                slides.forEach(s => s.style.visibility = '');
                slides.forEach(s => s.style.opacity = '');
                slides.forEach(s => s.style.transform = '');
                slides.forEach(s => s.style.filter = '');
                updateCounter();
            });
        }

        function toggleThemeSettings() {
            const panel = document.getElementById('theme-settings');
            panel.classList.toggle('active');
        }

        function updateBrandColor(variable, value) {
            document.documentElement.style.setProperty(variable, value);
        }

        function buildPresentation() {
            const globalTheme = presentationData.globalTheme || 'light';
            
            presentationData.slides.forEach((slide, index) => {
                const themeClass = slide.theme ? `theme-${slide.theme}` : `theme-${globalTheme}`;
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${themeClass} layout-${slide.type}`;
                if(index === 0) slideDiv.classList.add('active');

                const renderer = SlideRenderer[slide.type];
                if (renderer) {
                    let contentHtml = SlideRenderer.renderHeader(slide);
                    contentHtml += renderer(slide, index, slideDiv);
                    slideDiv.innerHTML = contentHtml;
                } else {
                    console.error(`Unknown slide type: ${slide.type}`);
                    slideDiv.innerHTML = `<div class="content-body"><h1>Unknown Slide Type: ${slide.type}</h1></div>`;
                }

                container.appendChild(slideDiv);

                if(slide.type.startsWith('chart')) {
                    setTimeout(() => initChart(`chart-${index}`, slide), 100);
                }
            });
            updateCounter();
        }

        function initChart(canvasId, slideData) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const colors = ['#01C38E', '#0090D6', '#0F4C5C'];
            
            // Store original colors for resetting
            const originalColors = [];

            slideData.chartData.datasets.forEach((ds, i) => {
                const color = colors[i % colors.length];
                ds.backgroundColor = color;
                ds.borderRadius = 4;
                originalColors.push(color);
            });

            const chart = new Chart(ctx, {
                type: slideData.type.split('-')[1], 
                data: slideData.chartData,
                plugins: [ChartDataLabels],
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'bottom', labels: { color: '#888' } },
                        datalabels: {
                            color: 'white',
                            anchor: 'end',
                            align: 'top',
                            font: {
                                weight: 'bold'
                            },
                            formatter: (value) => {
                                return Math.round(value);
                            }
                        }
                    },
                    scales: { 
                        x: { ticks: { color: '#888' } }, 
                        y: { ticks: { color: '#888' }, beginAtZero: true } 
                    },
                    onHover: (event, chartElement) => {
                        const canvas = chart.canvas;
                        canvas.style.cursor = chartElement.length > 0 ? 'pointer' : 'default';
                    },
                    onClick: (evt, elements) => {
                        const datalabels = chart.options.plugins.datalabels;

                        // If the user clicks a bar
                        if (elements.length > 0) {
                            const activeElement = elements[0];
                            const { datasetIndex, index } = activeElement;

                            // Fade all bars except the active one
                            chart.data.datasets.forEach((dataset, i) => {
                                dataset.backgroundColor = dataset.data.map((value, j) => {
                                    const originalColor = Array.isArray(originalColors[i]) ? originalColors[i][j] : originalColors[i];
                                    return (i === datasetIndex && j === index) ? originalColor : '#E0E0E0';
                                });
                            });
                            
                            // Fade all data labels except the active one
                            datalabels.color = (context) => {
                                return (context.datasetIndex === datasetIndex && context.dataIndex === index) ? 'white' : '#A0A0A0';
                            };

                            chart.update();
                        } else {
                            // If the user clicks outside a bar, reset all colors
                            chart.data.datasets.forEach((dataset, i) => {
                                dataset.backgroundColor = originalColors[i];
                            });
                            datalabels.color = 'white';
                            chart.update();
                        }
                    }
                }
            });
            chartInstances.push(chart);
        }

        function updateCounter(broadcast = true) {
            document.getElementById('page-counter').innerText = `${currentSlideIdx + 1} / ${presentationData.slides.length}`;
            const slides = document.querySelectorAll('.slide');

            slides.forEach((s, i) => {
                s.classList.remove('prev'); // Reset prev class

                // Reset animations
                const oldStaggerItems = s.querySelectorAll('.content-body li, .kpi-card, .grid-card, .workflow-step, .timeline-item, .comparison-item');
                oldStaggerItems.forEach(item => {
                    item.style.transitionDelay = '';
                });

                if(i === currentSlideIdx) {
                    s.classList.add('active');
                    
                    const staggerItems = s.querySelectorAll('.content-body li, .kpi-card, .grid-card, .workflow-step, .timeline-item, .comparison-item');
                    staggerItems.forEach((item, index) => {
                        const delay = 300 + (index * 80); 
                        item.style.transitionDelay = `${delay}ms`;
                    });

                    // Mark previous slide for transition effect
                    if (i > 0) slides[i-1].classList.add('prev');
                } else {
                    s.classList.remove('active');
                }
            });
            
            const progressPercent = presentationData.slides.length > 1 
                ? (currentSlideIdx / (presentationData.slides.length - 1)) * 100 
                : 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            if (broadcast) {
                syncChannel.postMessage({ type: 'sync', index: currentSlideIdx });
            }
        }

        function nextSlide() {
            currentSlideIdx = (currentSlideIdx + 1) % presentationData.slides.length;
            updateCounter();
        }

        function prevSlide() {
            currentSlideIdx = (currentSlideIdx - 1 + presentationData.slides.length) % presentationData.slides.length;
            updateCounter();
        }

        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {
                    console.log(`Unable to enter fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('keydown', (e) => {
            // Navigation
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
            
            // Jump to first/last slide
            if (e.key === 'Home') {
                e.preventDefault();
                currentSlideIdx = 0;
                updateCounter();
            }
            if (e.key === 'End') {
                e.preventDefault();
                currentSlideIdx = presentationData.slides.length - 1;
                updateCounter();
            }
            
            // Fullscreen toggle
            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                toggleFullscreen();
            }

            // Slide Sorter toggle
            if (e.key === 'g' || e.key === 'G') {
                e.preventDefault();
                toggleSlideSorter();
            }
            
            // Jump to specific slide (1-9 keys)
            if (e.key >= '1' && e.key <= '9') {
                const slideNum = parseInt(e.key) - 1;
                if (slideNum < presentationData.slides.length) {
                    e.preventDefault();
                    currentSlideIdx = slideNum;
                    updateCounter();
                }
            }
        });

        window.onload = buildPresentation;
    </script>
</body>
</html>
