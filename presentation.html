<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data&Analytics Presentation</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="presentation-container">
        </div>
    
    <div class="page-indicator" id="page-counter"></div>
    
    <div class="controls">
        <button class="btn" onclick="toggleFullscreen()" title="Fullscreen (F)">⛶</button>
        <button class="btn" onclick="prevSlide()">&#9664; Prev</button>
        <button class="btn" onclick="nextSlide()">Next &#9654;</button>
    </div>

    <script src="data.js"></script>

    <script>
        const container = document.getElementById('presentation-container');
        let currentSlideIdx = 0;
        let chartInstances = [];

        function buildPresentation() {
            const globalTheme = presentationData.globalTheme || 'light';
            
            presentationData.slides.forEach((slide, index) => {
                const themeClass = slide.theme ? `theme-${slide.theme}` : `theme-${globalTheme}`;
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${themeClass} layout-${slide.type}`;
                if(index === 0) slideDiv.classList.add('active');

                let contentHtml = '';

                // Header Generation (Logo on the far right)
                if(slide.type !== 'cover' && slide.type !== 'image-background') {
                    contentHtml += `
                        <div class="slide-header">
                            <div class="slide-title">${slide.title}</div>
                            <img src="images/logo.png" class="brand-logo" alt="Data&Analytics Logo" onerror="this.style.display='none'">
                        </div>
                    `;
                }

                // Content Generation
                switch(slide.type) {
                    case 'cover':
                        contentHtml += `
                            <img src="images/logo.png" class="brand-logo" alt="Logo" onerror="this.style.display='none'" style="margin-bottom: 30px; height: 80px;">
                            <h1 class="gradient-text">${slide.title}</h1>
                            <h2>${slide.subtitle}</h2>
                            <p style="margin-top:40px; font-size:1.2rem; opacity:0.8;">${slide.date || ''}</p>
                        `;
                        break;
                    case 'agenda':
                    case 'text':
                        let listHtml = slide.items ? `<ul>${slide.items.map(i => `<li>${i}</li>`).join('')}</ul>` : slide.content;
                        contentHtml += `<div class="content-body">${listHtml}</div>`;
                        break;
                    case 'kpi':
                        contentHtml += `<div class="kpi-grid">`;
                        slide.metrics.forEach(m => {
                            let color = m.status === 'up' ? 'var(--green)' : 'var(--blue)';
                            let arrow = m.status === 'up' ? '▲' : '▼';
                            contentHtml += `
                                <div class="kpi-card">
                                    <div class="kpi-label">${m.label}</div>
                                    <div class="kpi-value">${m.value}</div>
                                    <div class="kpi-detail"><span style="color:${color}">${arrow}</span> ${m.detail}</div>
                                </div>
                            `;
                        });
                        contentHtml += `</div>`;
                        break;
                    case 'workflow':
                        contentHtml += `<p class="content-body">${slide.description}</p><div class="workflow-container">`;
                        slide.steps.forEach(s => {
                            contentHtml += `<div class="workflow-step"><h4>${s.name}</h4><p>${s.detail}</p></div>`;
                        });
                        contentHtml += `</div>`;
                        break;
                    case 'timeline':
                        contentHtml += `<div class="timeline">`;
                        slide.events.forEach(e => {
                            contentHtml += `<div class="timeline-item"><div class="timeline-date">${e.date}</div><p>${e.text}</p></div>`;
                        });
                        contentHtml += `</div>`;
                        break;
                    case 'image-split':
                        contentHtml += `
                            <div class="split-layout">
                                <div class="split-text content-body">${slide.content}</div>
                                <div class="split-image" style="background-image: url('${slide.image}')"></div>
                            </div>
                        `;
                        break;
                    case 'image-full':
                        contentHtml += `
                            <div class="full-image-container">
                                <img src="${slide.image}" class="full-image" alt="Slide Image">
                                ${slide.caption ? `<div class="image-caption">${slide.caption}</div>` : ''}
                            </div>
                        `;
                        break;
                    case 'image-background':
                        slideDiv.style.backgroundImage = `url('${slide.image}')`;
                        slideDiv.style.backgroundSize = 'cover';
                        slideDiv.style.backgroundPosition = 'center';
                        slideDiv.style.animation = 'none'; 
                        contentHtml = `
                            <h2>${slide.title}</h2>
                            <p>${slide.content}</p>
                        `;
                        break;
                    case 'number-highlight':
                        contentHtml += `
                            <div class="big-number">${slide.number}</div>
                            <div class="big-number-text">${slide.text}</div>
                        `;
                        break;
                    case 'quote':
                        contentHtml += `
                            <div class="quote-text">${slide.quote}</div>
                            <div class="quote-author">— ${slide.author}</div>
                        `;
                        break;
                    case 'chart-bar':
                        contentHtml += `
                            <p class="content-body">${slide.description}</p>
                            <div class="chart-container"><canvas id="chart-${index}"></canvas></div>
                        `;
                        break;
                    case 'contact':
                        contentHtml += `
                            <div class="contact-box">
                                <h2>${slide.title}</h2>
                                <p>📧 ${slide.email}</p>
                                <p>📞 ${slide.phone}</p>
                                <p>📍 ${slide.location}</p>
                            </div>
                        `;
                        break;
                    case 'section-break':
                        contentHtml += `
                            <div class="section-break-content">
                                <h1 class="section-title">${slide.title}</h1>
                                ${slide.subtitle ? `<h2 class="section-subtitle">${slide.subtitle}</h2>` : ''}
                            </div>
                        `;
                        break;
                    case 'two-column':
                        contentHtml += `
                            <div class="two-column-layout">
                                <div class="column">
                                    ${slide.leftLabel ? `<h3 class="column-label">${slide.leftLabel}</h3>` : ''}
                                    <div class="column-content">${slide.leftContent}</div>
                                </div>
                                <div class="column">
                                    ${slide.rightLabel ? `<h3 class="column-label">${slide.rightLabel}</h3>` : ''}
                                    <div class="column-content">${slide.rightContent}</div>
                                </div>
                            </div>
                        `;
                        break;
                    case 'comparison':
                        contentHtml += `<div class="comparison-grid">`;
                        contentHtml += `<div class="comparison-column"><h3>${slide.leftLabel}</h3>`;
                        slide.leftItems.forEach(item => {
                            contentHtml += `<div class="comparison-item"><span class="item-icon">✗</span><p>${item}</p></div>`;
                        });
                        contentHtml += `</div>`;
                        contentHtml += `<div class="comparison-column"><h3>${slide.rightLabel}</h3>`;
                        slide.rightItems.forEach(item => {
                            contentHtml += `<div class="comparison-item"><span class="item-icon">✓</span><p>${item}</p></div>`;
                        });
                        contentHtml += `</div></div>`;
                        break;
                    case 'grid':
                        contentHtml += `
                            <div class="grid-container" style="--grid-columns: ${slide.columns || 3}">
                                ${slide.items.map(item => `
                                    <div class="grid-card">
                                        ${item.icon ? `<div class="grid-icon">${item.icon}</div>` : ''}
                                        ${item.image ? `<div class="grid-image" style="background-image: url('${item.image}')"></div>` : ''}
                                        <h4>${item.title}</h4>
                                        <p>${item.description}</p>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                        break;
                    case 'video':
                        contentHtml += `
                            <div class="video-container">
                                <div class="video-wrapper">
                                    ${slide.videoUrl.includes('youtube.com') || slide.videoUrl.includes('youtu.be') ?
                                        `<iframe src="${slide.videoUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>` :
                                        slide.videoUrl.includes('vimeo.com') ?
                                        `<iframe src="${slide.videoUrl}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>` :
                                        `<video controls style="width: 100%; height: 100%;"><source src="${slide.videoUrl}" type="video/mp4">Your browser does not support the video tag.</video>`
                                    }
                                </div>
                                ${slide.caption ? `<div class="video-caption">${slide.caption}</div>` : ''}
                            </div>
                        `;
                        break;
                }

                slideDiv.innerHTML = contentHtml;
                container.appendChild(slideDiv);

                if(slide.type.startsWith('chart')) {
                    setTimeout(() => initChart(`chart-${index}`, slide), 100);
                }
            });
            updateCounter();
        }

        function initChart(canvasId, slideData) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const colors = ['#01C38E', '#0090D6', '#0F4C5C'];
            slideData.chartData.datasets.forEach((ds, i) => {
                ds.backgroundColor = colors[i % colors.length];
                ds.borderRadius = 4;
            });

            const chart = new Chart(ctx, {
                type: slideData.type.split('-')[1], 
                data: slideData.chartData,
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#888' } } },
                    scales: { 
                        x: { ticks: { color: '#888' } }, 
                        y: { ticks: { color: '#888' } } 
                    }
                }
            });
            chartInstances.push(chart);
        }

        function updateCounter() {
            document.getElementById('page-counter').innerText = `${currentSlideIdx + 1} / ${presentationData.slides.length}`;
            const slides = document.querySelectorAll('.slide');
            slides.forEach((s, i) => {
                if(i === currentSlideIdx) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        function nextSlide() {
            currentSlideIdx = (currentSlideIdx + 1) % presentationData.slides.length;
            updateCounter();
        }

        function prevSlide() {
            currentSlideIdx = (currentSlideIdx - 1 + presentationData.slides.length) % presentationData.slides.length;
            updateCounter();
        }

        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {
                    console.log(`Unable to enter fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('keydown', (e) => {
            // Navigation
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
            
            // Jump to first/last slide
            if (e.key === 'Home') {
                e.preventDefault();
                currentSlideIdx = 0;
                updateCounter();
            }
            if (e.key === 'End') {
                e.preventDefault();
                currentSlideIdx = presentationData.slides.length - 1;
                updateCounter();
            }
            
            // Fullscreen toggle
            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                toggleFullscreen();
            }
            
            // Jump to specific slide (1-9 keys)
            if (e.key >= '1' && e.key <= '9') {
                const slideNum = parseInt(e.key) - 1;
                if (slideNum < presentationData.slides.length) {
                    e.preventDefault();
                    currentSlideIdx = slideNum;
                    updateCounter();
                }
            }
        });

        window.onload = buildPresentation;
    </script>
</body>
</html>
